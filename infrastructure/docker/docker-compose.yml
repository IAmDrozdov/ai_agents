x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Untrusted documents are parsed here: immutable image, /tmp in RAM, bounded pids.
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 256
  # docker logs is the only diagnostic here (OTEL is off), so bound it.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *hardening
    image: ai_agents:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: telegram-bot
    # Allow-listed keys written by deploy.sh; nothing else from the host reaches a container.
    env_file: /opt/ai_agents/bot.env
    # A runaway parse OOM-kills (and restarts) this container instead of thrashing the host.
    mem_limit: 700m
    memswap_limit: 900m
    environment:
      OTEL_ENABLED: "false"
      TELEGRAM_DB_PATH: /data/telegram_bot.sqlite3
      NOTES_DB_PATH: /data/notes.sqlite3
    volumes:
      - appdata:/data
    networks:
      - default
      - egress

  dashboard:
    <<: *hardening
    image: ai_agents:latest
    # Binds 0.0.0.0 INSIDE the container; the host-side publish below pins it
    # to the droplet's loopback, so it is only reachable via SSH tunnel.
    command: usage-dashboard --host 0.0.0.0 --port 8081
    mem_limit: 160m
    memswap_limit: 160m
    environment:
      OTEL_ENABLED: "false"
      TELEGRAM_DB_PATH: /data/telegram_bot.sqlite3
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - bot

  # Notes web UI (ADR-015): same loopback-only publish as the dashboard, no secrets.
  notes-web:
    <<: *hardening
    image: ai_agents:latest
    command: notes-web --host 0.0.0.0 --port 8082
    mem_limit: 160m
    memswap_limit: 160m
    environment:
      OTEL_ENABLED: "false"
      NOTES_DB_PATH: /data/notes.sqlite3
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - bot

  # Optional (profile "warp", ADR-014): free Cloudflare WARP egress for yt-dlp.
  # Reached only by the bot, over the `egress` network, as socks5h://warp:40000; no published port.
  warp:
    <<: *hardening
    profiles: ["warp"]
    image: ai_agents_warp:latest
    build:
      context: warp
    environment:
      WARP_ACCEPT_TOS: ${WARP_ACCEPT_TOS:-}
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - warpdata:/data
    networks:
      - egress

networks:
  egress:

volumes:
  appdata:
  warpdata:
