x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Untrusted documents are parsed here: immutable image, /tmp in RAM, bounded pids.
  read_only: true
  tmpfs:
    - /tmp
  pids_limit: 256
  # docker logs is the only diagnostic here (OTEL is off), so bound it.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *hardening
    image: maxi_bot:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    command: telegram-bot
    # Allow-listed keys written by deploy.sh; nothing else from the host reaches a container.
    env_file: /opt/maxi_bot/bot.env
    # A runaway parse OOM-kills (and restarts) this container instead of thrashing the host.
    mem_limit: 700m
    memswap_limit: 900m
    environment:
      OTEL_ENABLED: "false"
      TELEGRAM_DB_PATH: /data/telegram_bot.sqlite3
      NOTES_DB_PATH: /data/notes.sqlite3
    volumes:
      - appdata:/data
    networks:
      - default
      - egress

  # Admin Mini App (ADR-016): every /api call needs Telegram-signed initData from the admin.
  # Holds a derived HMAC key (miniapp.env), never the bot token. The loopback publish is only
  # for deploy.sh's health check; the funnel sidecar reaches it over the compose network.
  miniapp:
    <<: *hardening
    image: maxi_bot:latest
    command: telegram-miniapp --host 0.0.0.0 --port 8083
    env_file: /opt/maxi_bot/miniapp.env
    mem_limit: 160m
    memswap_limit: 160m
    environment:
      OTEL_ENABLED: "false"
      TELEGRAM_DB_PATH: /data/telegram_bot.sqlite3
      NOTES_DB_PATH: /data/notes.sqlite3
      DIARY_DB_PATH: /data/diary.sqlite3
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - bot

  # Optional (profile "funnel", ADR-016): publishes miniapp over HTTPS through Tailscale Funnel.
  # An outbound-only userspace node: no inbound port, and tsstate keeps its identity across restarts.
  funnel:
    <<: *hardening
    profiles: ["funnel"]
    image: tailscale/tailscale:v1.102.5
    env_file: /opt/maxi_bot/funnel.env
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      TS_HOSTNAME: maxi-bot
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    # containerboot keeps its socket under /var/run, which the read-only root would refuse.
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - miniapp

  # Optional (profile "warp", ADR-014): free Cloudflare WARP egress for yt-dlp.
  # Reached only by the bot, over the `egress` network, as socks5h://warp:40000; no published port.
  warp:
    <<: *hardening
    profiles: ["warp"]
    image: maxi_bot_warp:latest
    build:
      context: warp
    environment:
      WARP_ACCEPT_TOS: ${WARP_ACCEPT_TOS:-}
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - warpdata:/data
    networks:
      - egress

networks:
  egress:

volumes:
  appdata:
  warpdata:
  tsstate:
