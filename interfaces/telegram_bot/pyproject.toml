[project]
name = "telegram-bot-interface"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.10",
    "fastapi>=0.115",
    "starlette>=0.40",
    "urllib3>=2.0",
    "uvicorn>=0.31",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "trafilatura>=1.12",
    "shared",
    "pdf_tts",
    "doc_translator",
    "yt_dub",
]

[project.scripts]
telegram-bot = "telegram_bot.__main__:main"
usage-dashboard = "telegram_bot.dashboard.__main__:main"

[tool.uv.sources]
shared = { workspace = true }
pdf_tts = { workspace = true }
doc_translator = { workspace = true }
yt_dub = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot"]
