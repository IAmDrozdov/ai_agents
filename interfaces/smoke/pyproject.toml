[project]
name = "smoke-interface"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "pdf_tts",
    "doc_translator",
    "yt_dub",
]

[project.scripts]
smoke = "smoke.__main__:main"

[tool.uv.sources]
shared = { workspace = true }
pdf_tts = { workspace = true }
doc_translator = { workspace = true }
yt_dub = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoke"]
