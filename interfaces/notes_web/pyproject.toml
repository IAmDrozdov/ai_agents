[project]
name = "notes-web-interface"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.31",
    "shared",
    "notes",
]

[project.scripts]
notes-web = "notes_web.__main__:main"

[tool.uv.sources]
shared = { workspace = true }
notes = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_web"]
