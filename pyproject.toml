[project]
name = "ai-agents"
version = "0.0.0"
description = "Document translation, text-to-speech and YouTube dubbing workflows behind a private Telegram bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/IAmDrozdov/ai_agents"

[tool.uv.workspace]
members = ["shared", "workflows/*", "apps/*", "interfaces/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "doc_translator", "pdf_tts", "yt_dub", "notes", "telegram_bot", "smoke"]
