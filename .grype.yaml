# Run before a deploy: grype dir:. --only-fixed
exclude:
  - ./.venv/**
  - ./.git/**
  # Terraform provider binary (local tooling, never deployed).
  - ./infrastructure/terraform/.terraform/**
ignore:
  # Name collision: the root project "ai-agents" is not PyPI's aiwaves-cn "agents".
  - vulnerability: GHSA-ch88-c67q-65r9
