[project]
name = "pdf_tts"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "langchain-core>=0.3",
    "openai>=1.0",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_tts"]
