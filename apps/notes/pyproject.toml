[project]
name = "notes"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "aiohttp>=3.10",
    "pydantic>=2.7",
    "trafilatura>=1.12",
]

[project.scripts]
notes-smoke = "notes.smoke:main"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]
